services:
  postgres:
    image: postgres:16
    container_name: suraksha-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: suraksha
      POSTGRES_PASSWORD: suraksha_dev_pw
      POSTGRES_DB: suraksha_dhpms
    ports:
      - "5432:5432"
    volumes:
      - suraksha_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suraksha -d suraksha_dhpms"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    container_name: suraksha-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  suraksha_pg_data:
